  fil: '<p>Pamahalaan ang pang-araw-araw na mga talaan at hardware ng bukid sa inyong sariling mga kondisyon.</p>'
  fr: '<p>Gérez les registres quotidiens de la ferme et le matériel selon vos propres conditions.</p>'
  hi: '<p>खेत के रोज़मर्रा के रिकॉर्ड और हार्डवेयर अपनी शर्तों पर चलाएँ।</p>'
  id: '<p>Jalankan catatan pertanian harian dan perangkat keras dengan ketentuan Anda sendiri.</p>'
  it: "<p>Gestite i registri quotidiani dell'azienda agricola e l'hardware secondo le vostre condizioni.</p>"
  pt: '<p>Faça a gestão dos registos agrícolas do dia a dia e do hardware nos seus próprios termos.</p>'
  ru: '<p>Ведите повседневный учёт хозяйства и управляйте оборудованием на своих условиях.</p>'
  sw: '<p>Endesha kumbukumbu za shamba za kila siku na vifaa kwa masharti yako mwenyewe.</p>'
  zh_CN: '<p>按照您自己的方式管理日常农场记录和硬件。</p>'
