description:
  en: '<p>Talk, organize and make decisions together without handing the conversation to Big Tech.</p>'
  ar: '<p>تحدّثوا ونظّموا أنفسكم واتخذوا القرارات معًا من دون تسليم الحوار إلى شركات Big Tech.</p>'
  es: '<p>Conversa, organízate y toma decisiones en conjunto sin entregar la conversación a las Big Tech.</p>'
  fil: '<p>Mag-usap, mag-organisa at magpasya nang sama-sama nang hindi isinusuko ang usapan sa Big Tech.</p>'
  fr: '<p>Discutez, organisez-vous et prenez des décisions ensemble sans confier la conversation aux Big Tech.</p>'
  hi: '<p>बातचीत को Big Tech के हवाले किए बिना आपस में बात करें, संगठित हों और मिलकर निर्णय लें।</p>'
  id: '<p>Berbicara, berorganisasi, dan mengambil keputusan bersama tanpa menyerahkan percakapan kepada Big Tech.</p>'
  it: '<p>Parlate, organizzatevi e prendete decisioni insieme senza consegnare la conversazione alle Big Tech.</p>'
  pt: '<p>Converse, organize-se e tome decisões em conjunto sem entregar a conversa às Big Tech.</p>'
  ru: '<p>Общайтесь, организуйтесь и принимайте решения вместе, не отдавая разговор в руки Big Tech.</p>'
  sw: '<p>Zungumza, jipange na fanya maamuzi kwa pamoja bila kukabidhi mazungumzo kwa Big Tech.</p>'
  zh_CN: '<p>共同交流、组织和决策，而不必把对话交到科技巨头（Big Tech）手中。</p>'
