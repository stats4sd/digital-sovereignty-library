description:
  en: '<p>A box to locally host your sovereign digital tools. The Farm Hack box is community-built hardware: a small local server your community owns and runs, hosting your own tools and data (file storage, communication, farm records), even without reliable internet.</p>'
  ar: '<p>صندوق لاستضافة أدواتكم الرقمية السيادية محليًا. صندوق Farm Hack هو عتاد يبنيه المجتمع: خادم محلي صغير يملكه مجتمعكم ويديره، ويستضيف أدواتكم وبياناتكم (تخزين الملفات، والتواصل، وسجلات المزرعة)، حتى من دون اتصال موثوق بالإنترنت.</p>'
  es: '<p>Una caja para alojar localmente tus herramientas digitales soberanas. La Farm Hack Box es hardware construido por la comunidad: un pequeño servidor local que tu comunidad posee y gestiona, y que aloja tus propias herramientas y datos (almacenamiento de archivos, comunicación, registros de la finca), incluso sin una conexión a internet fiable.</p>'
  fil: '<p>Isang kahon para lokal na i-host ang inyong mga soberanong digital na kasangkapan. Ang Farm Hack box ay hardware na binuo ng komunidad: isang maliit na lokal na server na pagmamay-ari at pinapatakbo ng inyong komunidad, na nagho-host ng inyong sariling mga kasangkapan at data (imbakan ng file, komunikasyon, mga talaan ng bukid), kahit walang maaasahang internet.</p>'
  fr: '<p>Une box pour héberger localement vos outils numériques souverains. La Farm Hack Box est un matériel construit par la communauté : un petit serveur local que votre communauté possède et fait fonctionner, qui héberge vos propres outils et données (stockage de fichiers, communication, registres agricoles), même sans connexion internet fiable.</p>'
  hi: '<p>अपने संप्रभु डिजिटल उपकरणों को स्थानीय रूप से होस्ट करने के लिए एक बॉक्स। Farm Hack box समुदाय द्वारा बनाया गया हार्डवेयर है: एक छोटा स्थानीय सर्वर जिसका मालिक आपका समुदाय है और जिसे वही चलाता है, जो भरोसेमंद इंटरनेट के बिना भी आपके अपने उपकरण और डेटा (फ़ाइल भंडारण, संचार, खेत के रिकॉर्ड) होस्ट करता है।</p>'
  id: '<p>Sebuah kotak untuk menjalankan alat digital berdaulat Anda secara lokal. Farm Hack Box adalah perangkat keras yang dibangun oleh komunitas: sebuah server lokal kecil yang dimiliki dan dijalankan komunitas Anda, yang menampung alat dan data Anda sendiri (penyimpanan berkas, komunikasi, catatan pertanian), bahkan tanpa internet yang andal.</p>'
  it: "<p>Una scatola per ospitare in locale i vostri strumenti digitali sovrani. La Farm Hack box è hardware costruito dalla comunità: un piccolo server locale che la vostra comunità possiede e gestisce, che ospita i vostri strumenti e i vostri dati (archiviazione di file, comunicazione, registri dell'azienda agricola), anche senza una connessione internet affidabile.</p>"
  pt: '<p>Uma caixa para hospedar localmente as suas ferramentas digitais soberanas. A Farm Hack Box é hardware construído pela comunidade: um pequeno servidor local que a sua comunidade possui e opera, hospedando as suas próprias ferramentas e dados (armazenamento de arquivos, comunicação, registos agrícolas), mesmo sem internet confiável.</p>'
  ru: '<p>Коробка для локального размещения ваших суверенных цифровых инструментов. Farm Hack Box — это оборудование, собранное силами сообщества: небольшой локальный сервер, которым ваше сообщество владеет и управляет и на котором размещаются ваши собственные инструменты и данные (хранение файлов, связь, учёт хозяйства) даже без надёжного интернета.</p>'
  sw: '<p>Kisanduku cha kuhifadhi na kuendesha zana zako huru za kidijitali ndani ya eneo lako. Farm Hack Box ni vifaa vilivyoundwa na jamii: seva ndogo ya eneo ambayo jamii yako inaimiliki na kuiendesha, ikihifadhi zana na data zenu wenyewe (hifadhi ya faili, mawasiliano, kumbukumbu za shamba), hata bila intaneti ya kutegemewa.</p>'
  zh_CN: '<p>一个用于在本地托管您的自主数字工具的盒子。Farm Hack Box 是由社区自行搭建的硬件：一台由您的社区拥有并运行的小型本地服务器，用于托管您自己的工具和数据（文件存储、通讯、农场记录），即使没有稳定的互联网连接也能使用。</p>'
