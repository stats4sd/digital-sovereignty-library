key: digital-landscape
section: map
number: 1
title:
  en: 'Understanding the Digital Landscape'
description:
  en: |
    <p>This module is an introduction to the topic: why digital sovereignty is so important in our current world, and how it relates to food systems and agroecology.</p>
    <p>It looks at how a handful of technology and agriculture companies have come to control the digital infrastructure that food systems increasingly depend on, what that concentration of power means for farmers' rights, knowledge and livelihoods, and why data justice has to be understood collectively rather than as a question of who owns the files.</p>
goal:
  en: 'To build a strong foundation and help learners understand how modern digital tools and systems concentrate power, and why that matters for food sovereignty.'
learning_outcomes:
  -
    statement:
      en: 'Break down how major technology and agriculture companies merge their power by controlling essential infrastructure like digital platforms.'
    in_practice:
      en: 'you will be able to describe the cycle of data generation, processing and resale that links Big Tech and Big Ag, and name one example of it from your own context.'
  -
    statement:
      en: 'Identify clear risks where data collection, artificial intelligence (AI) and dependence on external tools threaten human rights, local cultures, traditional knowledge systems and global food security.'
    in_practice:
      en: 'you will be able to list the main risks — lock-in and dependency, surveillance, extraction without redistribution, and the sidelining of local knowledge — and say which ones your community already experiences.'
  -
    statement:
      en: "Understand that 'data justice' is not just about who owns the files; it means understanding how data belongs within a community, and what it means to have ownership over that collective wisdom."
    in_practice:
      en: "you will be able to explain, in your own words, the difference between individual data ownership and data that is embedded in a community's relationships, territory and shared knowledge."
