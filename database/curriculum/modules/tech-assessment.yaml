      fil: 'Magpasya kung ano ang dapat gawing digital, kung ano ang hindi, at sino ang magpapasya'
      fr: "Décider ce qui doit être numérisé, ce qui ne doit pas l'être, et qui en décide"
      hi: 'तय करें कि क्या डिजिटल किया जाना चाहिए, क्या नहीं, और यह कौन तय करता है'
      id: 'Memutuskan apa yang perlu didigitalkan, apa yang tidak, dan siapa yang memutuskan'
      it: 'Decidere cosa va digitalizzato, cosa no e chi lo decide'
