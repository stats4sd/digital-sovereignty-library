    title:
      en: 'KPL Food Coop Market Hub'
      ar: 'KPL Food Coop Market Hub'
      es: 'KPL Food Coop Market Hub'
      fil: 'KPL Food Coop Market Hub'
      fr: 'KPL Food Coop Market Hub'
      hi: 'KPL Food Coop Market Hub'
      id: 'KPL Food Coop Market Hub'
      it: 'KPL Food Coop Market Hub'
