      zh_CN: 'KPL Food Coop Market Hub'
    description:
      en: |-
        <p>The Kenyan Peasant League built its own cooperative food-market platform: a homegrown alternative to commercial marketplaces, showing what a community-owned market hub can look like in practice.</p>
        <h2>How to use it</h2>
        <p>Listen to the linked recording to hear how KPL designed, built and runs the hub: the decisions, the difficulties, and what it changed for members. Use it as a blueprint if your cooperative is considering the same path.</p>
      ar: |-
        <p>بنت منظمة Kenyan Peasant League (رابطة الفلاحين الكينية) منصتها الخاصة لسوق الأغذية التعاونية: بديل محلي الصنع عن الأسواق التجارية، يُظهر كيف يمكن أن يبدو مركز سوق مملوك للمجتمع في الواقع العملي.</p>
        <h2>كيفية الاستخدام</h2>
        <p>استمع إلى التسجيل المرتبط لتعرف كيف صمّمت KPL المركز وبنته وتديره: القرارات، والصعوبات، وما غيّره بالنسبة إلى الأعضاء. استخدمه كمخطط إرشادي إذا كانت تعاونيتك تفكر في السير على الطريق نفسه.</p>
      es: |-
        <p>La Kenyan Peasant League construyó su propia plataforma cooperativa de mercado de alimentos: una alternativa de creación propia a los mercados comerciales, que muestra cómo puede ser en la práctica un centro de mercado de propiedad comunitaria.</p>
        <h2>Cómo usarlo</h2>
        <p>Escucha la grabación enlazada para conocer cómo la KPL diseñó, construyó y gestiona el centro de mercado: las decisiones, las dificultades y lo que cambió para sus miembros. Úsalo como modelo si tu cooperativa está considerando seguir el mismo camino.</p>
      fil: |-
        <p>Binuo ng Kenyan Peasant League ang sarili nitong plataporma ng kooperatibang pamilihan ng pagkain: isang lokal na binuong alternatibo sa mga komersyal na marketplace, na nagpapakita kung ano ang maaaring maging hitsura ng isang market hub na pag-aari ng komunidad sa aktuwal na praktika.</p>
        <h2>Paano ito gamitin</h2>
        <p>Pakinggan ang naka-link na recording upang malaman kung paano dinisenyo, binuo at pinatatakbo ng KPL ang hub: ang mga desisyon, ang mga hirap, at kung ano ang nabago nito para sa mga miyembro. Gamitin ito bilang huwaran kung ang iyong kooperatiba ay nag-iisip na tahakin ang parehong landas.</p>
      fr: |-
        <p>La Kenyan Peasant League a construit sa propre plateforme coopérative de marché alimentaire : une alternative locale aux places de marché commerciales, qui montre concrètement ce à quoi peut ressembler un pôle de marché détenu par la communauté.</p>
        <h2>Comment l'utiliser</h2>
        <p>Écoutez l'enregistrement en lien pour découvrir comment la KPL a conçu, construit et fait fonctionner ce pôle : les décisions, les difficultés, et ce que cela a changé pour ses membres. Servez-vous-en comme modèle si votre coopérative envisage la même voie.</p>
      hi: |-
        <p>Kenyan Peasant League ने अपना स्वयं का सहकारी खाद्य-बाज़ार प्लेटफ़ॉर्म बनाया: व्यावसायिक मार्केटप्लेस का एक स्वदेशी विकल्प, जो दिखाता है कि समुदाय के स्वामित्व वाला बाज़ार हब व्यवहार में कैसा दिख सकता है।</p>
        <h2>इसका उपयोग कैसे करें</h2>
        <p>लिंक की गई रिकॉर्डिंग सुनें और जानें कि KPL ने इस हब को कैसे डिज़ाइन किया, बनाया और चलाता है: निर्णय, कठिनाइयाँ, और इसने सदस्यों के लिए क्या बदला। यदि आपकी सहकारी समिति भी इसी राह पर विचार कर रही है, तो इसे एक खाके के रूप में उपयोग करें।</p>
      id: |-
        <p>Kenyan Peasant League membangun platform pasar pangan koperasinya sendiri: alternatif buatan sendiri dari marketplace komersial, yang menunjukkan seperti apa wujud hub pasar milik komunitas dalam praktiknya.</p>
        <h2>Cara menggunakannya</h2>
        <p>Dengarkan rekaman yang ditautkan untuk mengetahui bagaimana KPL merancang, membangun, dan menjalankan hub ini: keputusan-keputusannya, kesulitan-kesulitannya, dan apa yang berubah bagi para anggota. Gunakan sebagai cetak biru jika koperasi Anda mempertimbangkan jalan yang sama.</p>
      it: |-
        <p>La Kenyan Peasant League ha costruito la propria piattaforma cooperativa per il mercato alimentare: un'alternativa fatta in casa ai marketplace commerciali, che mostra come può essere nella pratica un hub di mercato di proprietà della comunità.</p>
        <h2>Come usarlo</h2>
        <p>Ascolta la registrazione linkata per scoprire come KPL ha progettato, costruito e gestisce l'hub: le decisioni, le difficoltà e cosa è cambiato per i soci. Usala come modello se la tua cooperativa sta valutando lo stesso percorso.</p>
      pt: |-
        <p>A Kenyan Peasant League construiu a sua própria plataforma cooperativa de mercado alimentar: uma alternativa caseira aos mercados comerciais, que mostra como pode ser, na prática, um hub de mercado detido pela comunidade.</p>
        <h2>Como usar</h2>
        <p>Ouça a gravação ligada para saber como a KPL desenhou, construiu e opera o hub: as decisões, as dificuldades e o que mudou para os membros. Use-a como modelo se a sua cooperativa estiver a considerar o mesmo caminho.</p>
      ru: |-
