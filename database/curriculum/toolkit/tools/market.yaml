    description:
      en: |-
        <p>Open Food Network is open-source software for selling food directly: farmers and food hubs run their own online shops and manage orders without losing a cut, or their customer relationships, to a commercial marketplace.</p>
        <h2>How to use it</h2>
        <p>Set up a producer profile and shopfront on your local OFN instance, list products, and manage orders and pickups/deliveries through the platform. The linked video shows how farmers and buyers connect through it.</p>
      ar: |-
        <p>Open Food Network برنامج مفتوح المصدر لبيع الأغذية مباشرةً: يدير المزارعون ومراكز الأغذية متاجرهم الإلكترونية الخاصة ويتعاملون مع الطلبات دون أن يخسروا حصة من أرباحهم، أو علاقاتهم مع عملائهم، لصالح سوق تجارية.</p>
        <h2>كيفية الاستخدام</h2>
        <p>أنشئ ملفًا تعريفيًا للمنتِج وواجهة متجر على نسخة OFN المحلية لديك، وأدرج المنتجات، وأدِر الطلبات وعمليات الاستلام/التوصيل عبر المنصة. يعرض الفيديو المرتبط كيف يتواصل المزارعون والمشترون من خلاله.</p>
      es: |-
        <p>Open Food Network es un software de código abierto para vender alimentos directamente: los agricultores y los centros de acopio de alimentos gestionan sus propias tiendas en línea y administran los pedidos sin ceder una parte de sus ingresos, ni la relación con sus clientes, a un mercado comercial.</p>
        <h2>Cómo usarlo</h2>
        <p>Configura un perfil de productor y una tienda en línea en tu instancia local de OFN, publica tus productos y gestiona los pedidos y las recogidas o entregas a través de la plataforma. El video enlazado muestra cómo se conectan agricultores y compradores a través de ella.</p>
      fil: |-
        <p>Ang Open Food Network ay open-source software para sa direktang pagbebenta ng pagkain: pinatatakbo ng mga magsasaka at food hub ang kanilang sariling mga online na tindahan at pinamamahalaan ang mga order nang hindi nawawalan ng bahagi ng kita, o ng kanilang relasyon sa mga mamimili, sa isang komersyal na marketplace.</p>
        <h2>Paano ito gamitin</h2>
        <p>Mag-set up ng profile ng prodyuser at tindahan sa iyong lokal na OFN instance, ilista ang mga produkto, at pamahalaan ang mga order at pickup/delivery sa pamamagitan ng plataporma. Ipinapakita ng naka-link na video kung paano nagkakaugnay ang mga magsasaka at mamimili sa pamamagitan nito.</p>
      fr: |-
        <p>Open Food Network est un logiciel libre pour la vente directe de produits alimentaires : les agriculteurs et les pôles alimentaires gèrent leurs propres boutiques en ligne et leurs commandes sans céder une commission, ni leurs relations avec leurs clients, à une place de marché commerciale.</p>
        <h2>Comment l'utiliser</h2>
        <p>Créez un profil de producteur et une vitrine sur votre instance OFN locale, référencez vos produits, puis gérez les commandes ainsi que les retraits et livraisons via la plateforme. La vidéo en lien montre comment agriculteurs et acheteurs se mettent en relation grâce à cet outil.</p>
      hi: |-
        <p>Open Food Network सीधे भोजन बेचने के लिए ओपन-सोर्स सॉफ़्टवेयर है: किसान और फ़ूड हब अपनी ऑनलाइन दुकानें चलाते हैं और ऑर्डर प्रबंधित करते हैं, बिना अपनी कमाई का हिस्सा या अपने ग्राहक संबंध किसी व्यावसायिक मार्केटप्लेस को खोए।</p>
        <h2>इसका उपयोग कैसे करें</h2>
        <p>अपने स्थानीय OFN इंस्टेंस पर एक उत्पादक प्रोफ़ाइल और ऑनलाइन दुकान बनाएँ, उत्पाद सूचीबद्ध करें, और प्लेटफ़ॉर्म के ज़रिए ऑर्डर और पिकअप/डिलीवरी प्रबंधित करें। लिंक किया गया वीडियो दिखाता है कि किसान और खरीदार इसके माध्यम से कैसे जुड़ते हैं।</p>
      id: |-
        <p>Open Food Network adalah perangkat lunak sumber terbuka untuk menjual pangan secara langsung: petani dan hub pangan menjalankan toko daring mereka sendiri dan mengelola pesanan tanpa kehilangan sebagian pendapatan, maupun hubungan dengan pelanggan, kepada marketplace komersial.</p>
        <h2>Cara menggunakannya</h2>
        <p>Siapkan profil produsen dan etalase toko di instans OFN lokal Anda, daftarkan produk, lalu kelola pesanan serta pengambilan/pengiriman melalui platform tersebut. Video yang ditautkan menunjukkan bagaimana petani dan pembeli terhubung melaluinya.</p>
      it: |-
        <p>Open Food Network è un software open source per la vendita diretta di cibo: agricoltori e food hub gestiscono i propri negozi online e i propri ordini senza cedere una percentuale, né le relazioni con i clienti, a un marketplace commerciale.</p>
        <h2>Come usarlo</h2>
        <p>Crea un profilo da produttore e una vetrina sull'istanza OFN locale, inserisci i prodotti e gestisci ordini e ritiri/consegne attraverso la piattaforma. Il video linkato mostra come agricoltori e acquirenti si incontrano attraverso di essa.</p>
      pt: |-
        <p>A Open Food Network é software de código aberto para vender alimentos diretamente: agricultores e hubs alimentares gerem as suas próprias lojas online e os pedidos sem perder uma comissão, nem as relações com os clientes, para um mercado comercial.</p>
        <h2>Como usar</h2>
        <p>Configure um perfil de produtor e uma loja na sua instância local da OFN, liste produtos e faça a gestão de pedidos e recolhas/entregas através da plataforma. O vídeo ligado mostra como agricultores e compradores se ligam através dela.</p>
      ru: |-
        <p>Open Food Network — это программное обеспечение с открытым исходным кодом для прямых продаж продовольствия: фермеры и продовольственные хабы ведут собственные онлайн-магазины и управляют заказами, не отдавая коммерческой торговой площадке ни часть выручки, ни отношения со своими покупателями.</p>
        <h2>Как этим пользоваться</h2>
        <p>Создайте профиль производителя и витрину на локальном экземпляре OFN, добавьте товары и управляйте заказами, самовывозом и доставкой через платформу. Видео по ссылке показывает, как через неё связываются фермеры и покупатели.</p>
      sw: |-
        <p>Open Food Network ni programu huria ya kuuza chakula moja kwa moja: wakulima na vituo vya chakula huendesha maduka yao wenyewe ya mtandaoni na kusimamia oda bila kupoteza sehemu ya mapato, au mahusiano yao na wateja, kwa soko la kibiashara la mtandaoni.</p>
        <h2>Jinsi ya kuitumia</h2>
        <p>Sanidi wasifu wa mzalishaji na duka lako kwenye mfumo wa OFN wa eneo lako, orodhesha bidhaa, kisha simamia oda na uchukuaji/uwasilishaji kupitia jukwaa hilo. Video iliyounganishwa hapa inaonyesha jinsi wakulima na wanunuzi wanavyounganishwa kupitia jukwaa hilo.</p>
      zh_CN: |-
        <p>Open Food Network 是一款用于直接销售食品的开源软件：农民和食品中心可以自行运营网上商店并管理订单，无需向商业交易平台让出利润分成，也不会失去与顾客的关系。</p>
        <h2>如何使用</h2>
        <p>在您当地的 OFN 实例上建立生产者资料和店面，上架产品，并通过平台管理订单以及自取和配送。链接的视频展示了农民与买家如何通过它建立联系。</p>
