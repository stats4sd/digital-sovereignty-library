    description:
      en: |-
        <p>Point-of-sale tools your community can own: taking payments and tracking sales at markets and farm stands without locking your transaction data into a commercial provider.</p>
        <h2>How to use it</h2>
        <p>A practical walkthrough video is being recorded and will be linked here. It will cover choosing and setting up a point-of-sale tool for a small farm or co-op stand.</p>
      ar: |-
        <p>أدوات نقاط بيع يمكن لمجتمعك امتلاكها: لاستلام المدفوعات وتتبّع المبيعات في الأسواق ومنافذ البيع في المزارع دون حصر بيانات معاملاتك لدى مزوّد تجاري.</p>
        <h2>كيفية الاستخدام</h2>
        <p>يجري حاليًا تسجيل فيديو شرح عملي وسيُربط هنا. سيتناول اختيار أداة نقاط البيع وإعدادها لمزرعة صغيرة أو منفذ بيع تابع لتعاونية.</p>
      es: |-
        <p>Herramientas de punto de venta que tu comunidad puede poseer: cobrar pagos y llevar el control de las ventas en mercados y puestos de venta en la finca sin que los datos de tus transacciones queden atrapados en un proveedor comercial.</p>
        <h2>Cómo usarlo</h2>
        <p>Se está grabando un video práctico que se enlazará aquí. Explicará cómo elegir y configurar una herramienta de punto de venta para el puesto de una pequeña finca o cooperativa.</p>
      fil: |-
        <p>Mga kasangkapan sa point-of-sale na maaaring pag-aari ng iyong komunidad: pagtanggap ng bayad at pagsubaybay sa mga benta sa mga palengke at tindahan sa sakahan nang hindi nakakulong ang datos ng iyong mga transaksyon sa isang komersyal na provider.</p>
        <h2>Paano ito gamitin</h2>
        <p>Kasalukuyang nire-record ang isang praktikal na gabay na video at ila-link ito dito. Tatalakayin nito ang pagpili at pag-setup ng isang kasangkapan sa point-of-sale para sa isang maliit na sakahan o tindahan ng kooperatiba.</p>
      fr: |-
        <p>Des outils de point de vente que votre communauté peut posséder : encaisser les paiements et suivre les ventes sur les marchés et les étals à la ferme sans enfermer vos données de transaction chez un prestataire commercial.</p>
        <h2>Comment l'utiliser</h2>
        <p>Une vidéo de démonstration pratique est en cours d'enregistrement et sera mise en lien ici. Elle expliquera comment choisir et configurer un outil de point de vente pour une petite ferme ou un étal de coopérative.</p>
      hi: |-
        <p>पॉइंट-ऑफ़-सेल उपकरण जिनके मालिक आपका समुदाय स्वयं हो सकता है: बाज़ारों और खेत के स्टॉलों पर भुगतान लेना और बिक्री का हिसाब रखना, बिना अपने लेन-देन के डेटा को किसी व्यावसायिक प्रदाता के पास बंद किए।</p>
        <h2>इसका उपयोग कैसे करें</h2>
        <p>एक व्यावहारिक प्रदर्शन वीडियो रिकॉर्ड किया जा रहा है और यहाँ लिंक किया जाएगा। इसमें एक छोटे खेत या सहकारी स्टॉल के लिए पॉइंट-ऑफ़-सेल उपकरण चुनने और सेटअप करने के बारे में बताया जाएगा।</p>
      id: |-
        <p>Alat titik penjualan (kasir) yang dapat dimiliki komunitas Anda: menerima pembayaran dan melacak penjualan di pasar dan lapak tani tanpa mengunci data transaksi Anda pada penyedia komersial.</p>
        <h2>Cara menggunakannya</h2>
        <p>Video panduan praktis sedang direkam dan akan ditautkan di sini. Video ini akan membahas cara memilih dan menyiapkan alat titik penjualan untuk lapak usaha tani kecil atau koperasi.</p>
      it: |-
        <p>Strumenti per il punto vendita che la tua comunità può possedere: incassare i pagamenti e tracciare le vendite ai mercati e ai banchi in azienda senza vincolare i dati delle transazioni a un fornitore commerciale.</p>
        <h2>Come usarlo</h2>
        <p>Un video con una guida pratica è in fase di registrazione e sarà linkato qui. Tratterà la scelta e la configurazione di uno strumento per il punto vendita per il banco di una piccola azienda agricola o di una cooperativa.</p>
      pt: |-
        <p>Ferramentas de ponto de venda que a sua comunidade pode possuir: receber pagamentos e acompanhar vendas em mercados e bancas agrícolas sem prender os seus dados de transações a um fornecedor comercial.</p>
        <h2>Como usar</h2>
        <p>Um vídeo com um percurso prático está a ser gravado e será ligado aqui. Vai cobrir a escolha e a configuração de uma ferramenta de ponto de venda para uma pequena exploração ou banca de cooperativa.</p>
      ru: |-
        <p>Кассовые инструменты, которыми может владеть ваше сообщество: приём платежей и учёт продаж на рынках и фермерских прилавках без привязки данных о ваших операциях к коммерческому поставщику.</p>
        <h2>Как этим пользоваться</h2>
        <p>Практическое обучающее видео сейчас записывается и будет размещено здесь по ссылке. В нём будет рассказано, как выбрать и настроить кассовый инструмент для небольшого хозяйства или кооперативного прилавка.</p>
      sw: |-
        <p>Zana za vituo vya mauzo ambazo jamii yako inaweza kuzimiliki: kupokea malipo na kufuatilia mauzo sokoni na kwenye vibanda vya shambani bila kufungia data ya miamala yako kwa mtoa huduma wa kibiashara.</p>
        <h2>Jinsi ya kuitumia</h2>
        <p>Video ya maelekezo ya vitendo inarekodiwa na itaunganishwa hapa. Itahusu kuchagua na kusanidi zana ya kituo cha mauzo kwa ajili ya shamba dogo au kibanda cha ushirika.</p>
      zh_CN: |-
        <p>您的社区可以自主拥有的销售点工具：在集市和农场摊位上收款并追踪销售情况，而不会让您的交易数据被锁定在商业服务商手中。</p>
        <h2>如何使用</h2>
        <p>一段实操演示视频正在录制中，完成后将在此处链接。视频将介绍如何为小型农场或合作社摊位选择并设置销售点工具。</p>
