    description:
      en: |-
        <p>Guardian Connector is data infrastructure for communities defending their territories: it brings together the data collected with tools like Mapeo and ODK into storage and dashboards the community governs.</p>
        <h2>How to use it</h2>
        <p>Connect your field-data tools so observations flow into one place, then use the dashboards to review, analyse and share what your community decides to share. The linked video introduces the setup and a real deployment.</p>
      ar: |-
        <p>Guardian Connector بنية تحتية للبيانات مخصصة للمجتمعات التي تدافع عن أقاليمها: يجمع البيانات التي جُمعت بأدوات مثل Mapeo وODK في مخازن ولوحات معلومات يحكمها المجتمع.</p>
        <h2>كيفية الاستخدام</h2>
        <p>اربط أدوات البيانات الميدانية لديك لتتدفق الملاحظات إلى مكان واحد، ثم استخدم لوحات المعلومات لمراجعة البيانات وتحليلها ومشاركة ما يقرر مجتمعك مشاركته. يعرّف الفيديو المرتبط بعملية الإعداد وبتجربة نشر حقيقية.</p>
      es: |-
        <p>Guardian Connector es una infraestructura de datos para comunidades que defienden sus territorios: reúne los datos recopilados con herramientas como Mapeo y ODK en sistemas de almacenamiento y paneles de control que gobierna la propia comunidad.</p>
        <h2>Cómo usarlo</h2>
        <p>Conecta tus herramientas de datos de campo para que las observaciones fluyan hacia un solo lugar, y luego usa los paneles de control para revisar, analizar y compartir lo que tu comunidad decida compartir. El video enlazado presenta la configuración y un despliegue real.</p>
      fil: |-
        <p>Ang Guardian Connector ay imprastraktura ng datos para sa mga komunidad na nagtatanggol sa kanilang mga teritoryo: pinagsasama-sama nito ang datos na nakolekta gamit ang mga kasangkapan tulad ng Mapeo at ODK sa storage at mga dashboard na pinamamahalaan ng komunidad.</p>
        <h2>Paano ito gamitin</h2>
        <p>Ikonekta ang iyong mga kasangkapan sa datos mula sa larangan upang dumaloy ang mga obserbasyon sa isang lugar, pagkatapos ay gamitin ang mga dashboard upang suriin, analisahin at ibahagi ang anumang napagdesisyunan ng iyong komunidad na ibahagi. Ipinakikilala ng naka-link na video ang pag-setup at isang tunay na deployment.</p>
      fr: |-
        <p>Guardian Connector est une infrastructure de données pour les communautés qui défendent leurs territoires : elle rassemble les données collectées avec des outils comme Mapeo et ODK dans des espaces de stockage et des tableaux de bord gouvernés par la communauté.</p>
        <h2>Comment l'utiliser</h2>
        <p>Connectez vos outils de collecte de données de terrain afin que les observations convergent en un seul endroit, puis utilisez les tableaux de bord pour examiner, analyser et partager ce que votre communauté décide de partager. La vidéo en lien présente la configuration et un déploiement réel.</p>
      hi: |-
        <p>Guardian Connector अपने क्षेत्रों की रक्षा करने वाले समुदायों के लिए डेटा अवसंरचना है: यह Mapeo और ODK जैसे उपकरणों से एकत्र किए गए डेटा को ऐसे भंडारण और डैशबोर्ड में एक साथ लाता है जिनका संचालन समुदाय स्वयं करता है।</p>
        <h2>इसका उपयोग कैसे करें</h2>
        <p>अपने फ़ील्ड-डेटा उपकरणों को जोड़ें ताकि अवलोकन एक ही जगह पहुँचें, फिर डैशबोर्ड का उपयोग करके समीक्षा करें, विश्लेषण करें और वह साझा करें जो आपका समुदाय साझा करने का निर्णय लेता है। लिंक किया गया वीडियो सेटअप और एक वास्तविक कार्यान्वयन का परिचय देता है।</p>
      id: |-
        <p>Guardian Connector adalah infrastruktur data untuk komunitas yang mempertahankan wilayah mereka: ia menghimpun data yang dikumpulkan dengan alat seperti Mapeo dan ODK ke dalam penyimpanan dan dasbor yang dikelola sendiri oleh komunitas.</p>
        <h2>Cara menggunakannya</h2>
        <p>Hubungkan alat data lapangan Anda agar pengamatan mengalir ke satu tempat, lalu gunakan dasbor untuk meninjau, menganalisis, dan membagikan apa yang diputuskan komunitas Anda untuk dibagikan. Video yang ditautkan memperkenalkan proses penyiapan dan sebuah penerapan nyata.</p>
      it: |-
        <p>Guardian Connector è un'infrastruttura dati per le comunità che difendono i propri territori: riunisce i dati raccolti con strumenti come Mapeo e ODK in archivi e dashboard governati dalla comunità.</p>
        <h2>Come usarlo</h2>
        <p>Collega i tuoi strumenti di raccolta dati sul campo in modo che le osservazioni confluiscano in un unico luogo, poi usa le dashboard per esaminare, analizzare e condividere ciò che la tua comunità decide di condividere. Il video linkato presenta la configurazione e un'implementazione reale.</p>
      pt: |-
        <p>O Guardian Connector é infraestrutura de dados para comunidades que defendem os seus territórios: reúne os dados recolhidos com ferramentas como o Mapeo e o ODK em armazenamento e painéis governados pela comunidade.</p>
        <h2>Como usar</h2>
        <p>Ligue as suas ferramentas de dados de campo para que as observações fluam para um só lugar, depois use os painéis para rever, analisar e partilhar o que a sua comunidade decidir partilhar. O vídeo ligado apresenta a configuração e uma implementação real.</p>
      ru: |-
        <p>Guardian Connector — это инфраструктура данных для сообществ, защищающих свои территории: она объединяет данные, собранные с помощью таких инструментов, как Mapeo и ODK, в хранилище и панели мониторинга, которыми управляет само сообщество.</p>
        <h2>Как этим пользоваться</h2>
        <p>Подключите свои инструменты сбора полевых данных, чтобы наблюдения стекались в одно место, а затем используйте панели мониторинга, чтобы просматривать, анализировать и делиться тем, чем ваше сообщество решит поделиться. Видео по ссылке знакомит с настройкой и реальным внедрением.</p>
      sw: |-
        <p>Guardian Connector ni miundombinu ya data kwa ajili ya jamii zinazolinda maeneo yao: huikusanya data iliyokusanywa kwa zana kama Mapeo na ODK katika hifadhi na dashibodi zinazosimamiwa na jamii yenyewe.</p>
        <h2>Jinsi ya kuitumia</h2>
        <p>Unganisha zana zako za data ya uwandani ili uchunguzi wote uingie sehemu moja, kisha tumia dashibodi kupitia, kuchambua na kushirikisha kile ambacho jamii yako imeamua kukishirikisha. Video iliyounganishwa hapa inatambulisha usanidi na utekelezaji halisi.</p>
      zh_CN: |-
