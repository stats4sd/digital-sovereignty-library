    description:
      en: |-
        <p>EcoAgTube is a video-sharing platform for agroecology and rural communities: an alternative to commercial platforms, run for and by the movement, where practical farming knowledge is shared without ads or algorithmic control.</p>
        <h2>How to use it</h2>
        <p>Browse or search for videos in your language, and create a free account to upload your own: field techniques, trainings, community stories. The introduction video linked here gives a tour.</p>
      ar: |-
        <p>EcoAgTube منصة لتبادل مقاطع الفيديو مخصصة للإيكولوجيا الزراعية والمجتمعات الريفية: بديل عن المنصات التجارية، تديرها الحركة ومن أجلها، وتُتبادل فيها المعارف الزراعية العملية دون إعلانات أو تحكّم خوارزمي.</p>
        <h2>كيفية الاستخدام</h2>
        <p>تصفّح مقاطع الفيديو أو ابحث عنها بلغتك، وأنشئ حسابًا مجانيًا لرفع مقاطعك الخاصة: تقنيات ميدانية، ودورات تدريبية، وقصص مجتمعية. يقدّم فيديو التعريف المرتبط هنا جولة في المنصة.</p>
      es: |-
        <p>EcoAgTube es una plataforma para compartir videos sobre agroecología y comunidades rurales: una alternativa a las plataformas comerciales, gestionada por y para el movimiento, donde se comparte conocimiento agrícola práctico sin anuncios ni control algorítmico.</p>
        <h2>Cómo usarlo</h2>
        <p>Explora o busca videos en tu idioma y crea una cuenta gratuita para subir los tuyos: técnicas de campo, capacitaciones, historias comunitarias. El video de introducción enlazado aquí ofrece un recorrido por la plataforma.</p>
      fil: |-
        <p>Ang EcoAgTube ay isang plataporma sa pagbabahagi ng video para sa agroekolohiya at mga komunidad sa kanayunan: isang alternatibo sa mga komersyal na plataporma, na pinatatakbo para sa at ng kilusan, kung saan ibinabahagi ang praktikal na kaalaman sa pagsasaka nang walang mga ad o kontrol ng algorithm.</p>
        <h2>Paano ito gamitin</h2>
        <p>Mag-browse o maghanap ng mga video sa iyong wika, at gumawa ng libreng account upang mag-upload ng sarili mong mga video: mga teknik sa bukid, pagsasanay, kuwento ng komunidad. Nagbibigay ng paglilibot ang panimulang video na naka-link dito.</p>
      fr: |-
        <p>EcoAgTube est une plateforme de partage de vidéos pour l'agroécologie et les communautés rurales : une alternative aux plateformes commerciales, gérée pour et par le mouvement, où les savoirs agricoles pratiques se partagent sans publicité ni contrôle algorithmique.</p>
        <h2>Comment l'utiliser</h2>
        <p>Parcourez ou recherchez des vidéos dans votre langue, et créez un compte gratuit pour publier les vôtres : techniques de terrain, formations, récits communautaires. La vidéo d'introduction en lien ici en propose une visite guidée.</p>
      hi: |-
        <p>EcoAgTube कृषि-पारिस्थितिकी और ग्रामीण समुदायों के लिए एक वीडियो-साझाकरण प्लेटफ़ॉर्म है: व्यावसायिक प्लेटफ़ॉर्मों का एक विकल्प, जो आंदोलन के लिए और आंदोलन द्वारा चलाया जाता है, जहाँ खेती का व्यावहारिक ज्ञान बिना विज्ञापनों या एल्गोरिदम के नियंत्रण के साझा किया जाता है।</p>
        <h2>इसका उपयोग कैसे करें</h2>
        <p>अपनी भाषा में वीडियो ब्राउज़ करें या खोजें, और अपने वीडियो अपलोड करने के लिए एक मुफ़्त खाता बनाएँ: खेत की तकनीकें, प्रशिक्षण, समुदाय की कहानियाँ। यहाँ लिंक किया गया परिचय वीडियो इसकी सैर कराता है।</p>
      id: |-
        <p>EcoAgTube adalah platform berbagi video untuk agroekologi dan komunitas pedesaan: alternatif dari platform komersial, dijalankan untuk dan oleh gerakan itu sendiri, tempat pengetahuan bertani yang praktis dibagikan tanpa iklan atau kendali algoritma.</p>
        <h2>Cara menggunakannya</h2>
        <p>Jelajahi atau cari video dalam bahasa Anda, dan buat akun gratis untuk mengunggah video Anda sendiri: teknik lapangan, pelatihan, cerita komunitas. Video pengantar yang ditautkan di sini mengajak Anda berkeliling.</p>
      it: |-
        <p>EcoAgTube è una piattaforma di condivisione video per l'agroecologia e le comunità rurali: un'alternativa alle piattaforme commerciali, gestita dal movimento e per il movimento, dove le conoscenze agricole pratiche si condividono senza pubblicità né controllo algoritmico.</p>
        <h2>Come usarlo</h2>
        <p>Sfoglia o cerca i video nella tua lingua e crea un account gratuito per caricare i tuoi: tecniche di campo, formazioni, storie di comunità. Il video introduttivo linkato qui offre una panoramica.</p>
      pt: |-
        <p>O EcoAgTube é uma plataforma de partilha de vídeos para a agroecologia e as comunidades rurais: uma alternativa às plataformas comerciais, gerida para e pelo movimento, onde o conhecimento agrícola prático é partilhado sem anúncios nem controlo algorítmico.</p>
        <h2>Como usar</h2>
        <p>Navegue ou pesquise vídeos na sua língua e crie uma conta gratuita para carregar os seus: técnicas de campo, formações, histórias da comunidade. O vídeo de introdução ligado aqui faz uma visita guiada.</p>
      ru: |-
        <p>EcoAgTube — это платформа для обмена видео, посвящённая агроэкологии и сельским сообществам: альтернатива коммерческим платформам, которой управляет само движение и для движения, где практические знания о ведении хозяйства распространяются без рекламы и алгоритмического контроля.</p>
        <h2>Как этим пользоваться</h2>
        <p>Просматривайте видео или ищите их на своём языке, а также создайте бесплатный аккаунт, чтобы загружать собственные: полевые приёмы, обучающие материалы, истории сообществ. Вводное видео по ссылке проведёт вас по платформе.</p>
      sw: |-
        <p>EcoAgTube ni jukwaa la kushirikisha video kwa ajili ya kilimo-ikolojia na jamii za vijijini: mbadala wa majukwaa ya kibiashara, linaloendeshwa na harakati kwa ajili ya harakati yenyewe, ambapo maarifa ya vitendo ya kilimo hushirikishwa bila matangazo au udhibiti wa algoriti.</p>
        <h2>Jinsi ya kuitumia</h2>
        <p>Vinjari au tafuta video katika lugha yako, na ufungue akaunti ya bure ili kupakia video zako mwenyewe: mbinu za shambani, mafunzo, hadithi za jamii. Video ya utangulizi iliyounganishwa hapa inakutembeza katika jukwaa hilo.</p>
      zh_CN: |-
        <p>EcoAgTube 是一个面向农业生态学和乡村社区的视频分享平台：它是商业平台之外的另一种选择，由运动自身运营、为运动服务，在这里分享实用的农耕知识，没有广告，也不受算法控制。</p>
        <h2>如何使用</h2>
        <p>浏览或搜索您所用语言的视频，并注册一个免费账户来上传自己的视频：田间技术、培训、社区故事。此处链接的介绍视频带您快速了解该平台。</p>
