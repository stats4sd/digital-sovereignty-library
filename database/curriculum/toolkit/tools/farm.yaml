    description:
      en: |-
        <p>farmOS is open-source farm record-keeping you can self-host: plantings, animals, inputs, observations and maps, stored in a system your farm or cooperative controls completely.</p>
        <h2>How to use it</h2>
        <p>Use the hosted Farmier service or install farmOS on your own server (including a local box), then record activities as logs against your fields and assets. Start simple, with a few key records, and grow into it.</p>
      ar: |-
        <p>farmOS نظام مفتوح المصدر لحفظ سجلات المزرعة يمكنك استضافته بنفسك: المزروعات، والحيوانات، والمدخلات، والملاحظات، والخرائط، مخزّنة في نظام تتحكم فيه مزرعتك أو تعاونيتك بالكامل.</p>
        <h2>كيفية الاستخدام</h2>
        <p>استخدم خدمة Farmier المستضافة أو ثبّت farmOS على خادمك الخاص (بما في ذلك جهاز محلي)، ثم سجّل الأنشطة كسجلات مرتبطة بحقولك وأصولك. ابدأ ببساطة، ببعض السجلات الأساسية، وتوسّع تدريجيًا.</p>
      es: |-
        <p>farmOS es un sistema de código abierto para llevar los registros de la finca que puedes alojar tú mismo: siembras, animales, insumos, observaciones y mapas, almacenados en un sistema que tu finca o cooperativa controla por completo.</p>
        <h2>Cómo usarlo</h2>
        <p>Usa el servicio alojado Farmier o instala farmOS en tu propio servidor (incluso en un equipo local), y luego anota las actividades como registros asociados a tus parcelas y activos. Empieza de forma sencilla, con unos pocos registros clave, y ve ampliándolo con el tiempo.</p>
      fil: |-
        <p>Ang farmOS ay open-source na sistema ng pagtatala ng rekord ng sakahan na maaari mong i-self-host: mga taniman, hayop, input, obserbasyon at mapa, na nakaimbak sa isang sistemang ganap na kontrolado ng iyong sakahan o kooperatiba.</p>
        <h2>Paano ito gamitin</h2>
        <p>Gamitin ang hosted na serbisyo ng Farmier o i-install ang farmOS sa iyong sariling server (kabilang ang isang lokal na makina), pagkatapos ay itala ang mga aktibidad bilang mga log para sa iyong mga bukirin at ari-arian. Magsimula sa simple, sa ilang mahahalagang rekord, at unti-unting palawakin.</p>
      fr: |-
        <p>farmOS est un outil libre de tenue de registres agricoles que vous pouvez auto-héberger : plantations, animaux, intrants, observations et cartes, stockés dans un système que votre ferme ou votre coopérative contrôle entièrement.</p>
        <h2>Comment l'utiliser</h2>
        <p>Utilisez le service hébergé Farmier ou installez farmOS sur votre propre serveur (y compris une machine locale), puis enregistrez vos activités sous forme de journaux liés à vos parcelles et à vos actifs. Commencez simplement, avec quelques enregistrements clés, puis élargissez progressivement.</p>
      hi: |-
        <p>farmOS एक ओपन-सोर्स खेत रिकॉर्ड-कीपिंग प्रणाली है जिसे आप स्वयं होस्ट कर सकते हैं: रोपाई, पशु, इनपुट, अवलोकन और नक्शे, एक ऐसी प्रणाली में संग्रहीत जिस पर आपके खेत या सहकारी समिति का पूरा नियंत्रण होता है।</p>
        <h2>इसका उपयोग कैसे करें</h2>
        <p>होस्टेड Farmier सेवा का उपयोग करें या farmOS को अपने सर्वर पर (स्थानीय मशीन सहित) इंस्टॉल करें, फिर अपने खेतों और संपत्तियों के लिए गतिविधियों को लॉग के रूप में दर्ज करें। कुछ मुख्य रिकॉर्ड के साथ सरल शुरुआत करें, और धीरे-धीरे इसमें आगे बढ़ें।</p>
      id: |-
        <p>farmOS adalah sistem pencatatan usaha tani sumber terbuka yang dapat Anda hosting sendiri: penanaman, hewan ternak, input, pengamatan, dan peta, tersimpan dalam sistem yang sepenuhnya dikendalikan oleh usaha tani atau koperasi Anda.</p>
        <h2>Cara menggunakannya</h2>
        <p>Gunakan layanan hosting Farmier atau pasang farmOS di server Anda sendiri (termasuk komputer lokal), lalu catat kegiatan sebagai log yang terhubung dengan lahan dan aset Anda. Mulailah dengan sederhana, dengan beberapa catatan penting, lalu kembangkan seiring waktu.</p>
      it: |-
        <p>farmOS è un software open source per la tenuta dei registri agricoli che puoi ospitare sul tuo server: piantagioni, animali, input, osservazioni e mappe, conservati in un sistema che la tua azienda agricola o cooperativa controlla completamente.</p>
        <h2>Come usarlo</h2>
        <p>Usa il servizio in hosting Farmier oppure installa farmOS sul tuo server (anche su una macchina locale), poi registra le attività come log associati ai tuoi campi e alle tue risorse. Inizia in modo semplice, con pochi registri fondamentali, e cresci gradualmente.</p>
      pt: |-
        <p>O farmOS é um sistema de registos agrícolas de código aberto que pode alojar por conta própria: plantações, animais, insumos, observações e mapas, guardados num sistema que a sua exploração ou cooperativa controla por completo.</p>
        <h2>Como usar</h2>
        <p>Use o serviço alojado Farmier ou instale o farmOS no seu próprio servidor (incluindo uma caixa local), depois registe as atividades como registos associados aos seus campos e ativos. Comece de forma simples, com alguns registos-chave, e vá crescendo.</p>
      ru: |-
        <p>farmOS — это система учёта в хозяйстве с открытым исходным кодом, которую можно разместить на собственном сервере: посадки, животные, вносимые ресурсы, наблюдения и карты хранятся в системе, которую ваше хозяйство или кооператив контролирует полностью.</p>
        <h2>Как этим пользоваться</h2>
        <p>Используйте хостинг-сервис Farmier или установите farmOS на собственный сервер (в том числе на локальный компьютер), а затем фиксируйте действия в виде записей журнала, привязанных к вашим полям и активам. Начните с простого — с нескольких ключевых записей — и постепенно осваивайте остальное.</p>
      sw: |-
        <p>farmOS ni programu huria ya kutunza kumbukumbu za shamba unayoweza kuiendesha kwenye seva yako mwenyewe: upandaji, wanyama, pembejeo, uchunguzi na ramani, vikihifadhiwa katika mfumo unaodhibitiwa kikamilifu na shamba lako au ushirika wako.</p>
        <h2>Jinsi ya kuitumia</h2>
        <p>Tumia huduma ya Farmier inayohifadhiwa mtandaoni au sakinisha farmOS kwenye seva yako mwenyewe (ikiwa ni pamoja na kompyuta ya hapo hapo shambani), kisha andika shughuli kama rekodi zinazohusiana na mashamba na mali zako. Anza kwa urahisi, kwa kumbukumbu chache muhimu, kisha ukue nayo hatua kwa hatua.</p>
      zh_CN: |-
        <p>farmOS 是一款可自行托管的开源农场记录工具：种植、牲畜、投入品、观察记录和地图，全部存储在一个由您的农场或合作社完全掌控的系统中。</p>
        <h2>如何使用</h2>
        <p>使用托管的 Farmier 服务，或在您自己的服务器（包括本地的一台机器）上安装 farmOS，然后将各项活动作为日志记录到您的田地和资产上。从简单开始，先记录几项关键内容，再逐步深入。</p>
