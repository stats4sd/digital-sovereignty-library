    description:
      en: |-
        <p>LiteFarm is free, open-source farm management software built with and for farmers (crop planning, task management, harvest records and certification paperwork), developed at the University of British Columbia with sustainability at its core.</p>
        <h2>How to use it</h2>
        <p>Create a free account, map your farm, and start planning crops and logging tasks; records build up into reports you own and can export. Two linked videos cover it from both sides: the principles behind LiteFarm, and a practical walkthrough from a farming association using it day to day.</p>
      ar: |-
        <p>LiteFarm برنامج مجاني مفتوح المصدر لإدارة المزارع، بُني مع المزارعين ومن أجلهم (تخطيط المحاصيل، وإدارة المهام، وسجلات الحصاد، وأوراق الحصول على الشهادات)، وطُوّر في جامعة كولومبيا البريطانية والاستدامة في صميمه.</p>
        <h2>كيفية الاستخدام</h2>
        <p>أنشئ حسابًا مجانيًا، وارسم خريطة مزرعتك، وابدأ بتخطيط المحاصيل وتسجيل المهام؛ تتراكم السجلات لتشكّل تقارير تملكها ويمكنك تصديرها. يتناوله فيديوان مرتبطان من الجانبين: المبادئ التي يقوم عليها LiteFarm، وشرح عملي من جمعية زراعية تستخدمه يومًا بيوم.</p>
      es: |-
        <p>LiteFarm es un software gratuito y de código abierto para la gestión de fincas, creado con y para agricultores (planificación de cultivos, gestión de tareas, registros de cosecha y documentación para certificaciones), desarrollado en la University of British Columbia con la sostenibilidad como eje central.</p>
        <h2>Cómo usarlo</h2>
        <p>Crea una cuenta gratuita, mapea tu finca y empieza a planificar cultivos y registrar tareas; los registros se van acumulando en informes que son tuyos y que puedes exportar. Dos videos enlazados lo abordan desde ambos lados: los principios detrás de LiteFarm y un recorrido práctico de una asociación de agricultores que lo usa en su día a día.</p>
      fil: |-
        <p>Ang LiteFarm ay libre at open-source na software sa pamamahala ng sakahan na ginawa kasama at para sa mga magsasaka (pagpaplano ng pananim, pamamahala ng mga gawain, rekord ng ani at mga papeles para sa sertipikasyon), na binuo sa University of British Columbia na may sustainability bilang pundasyon nito.</p>
        <h2>Paano ito gamitin</h2>
        <p>Gumawa ng libreng account, imapa ang iyong sakahan, at simulang magplano ng mga pananim at magtala ng mga gawain; nabubuo ang mga rekord sa mga ulat na pag-aari mo at maaari mong i-export. Dalawang naka-link na video ang tumatalakay dito mula sa magkabilang panig: ang mga prinsipyo sa likod ng LiteFarm, at isang praktikal na gabay mula sa isang samahan ng mga magsasaka na gumagamit nito araw-araw.</p>
      fr: |-
        <p>LiteFarm est un logiciel libre et gratuit de gestion agricole conçu avec et pour les agriculteurs (planification des cultures, gestion des tâches, registres de récolte et documents de certification), développé à l'University of British Columbia avec la durabilité au cœur de sa conception.</p>
        <h2>Comment l'utiliser</h2>
        <p>Créez un compte gratuit, cartographiez votre ferme, puis commencez à planifier vos cultures et à consigner vos tâches ; les enregistrements s'accumulent pour former des rapports qui vous appartiennent et que vous pouvez exporter. Deux vidéos en lien l'abordent sous deux angles : les principes qui sous-tendent LiteFarm, et une démonstration pratique par une association agricole qui l'utilise au quotidien.</p>
      hi: |-
        <p>LiteFarm किसानों के साथ और किसानों के लिए बनाया गया मुफ़्त, ओपन-सोर्स खेत प्रबंधन सॉफ़्टवेयर है (फ़सल योजना, कार्य प्रबंधन, फ़सल कटाई के रिकॉर्ड और प्रमाणन की कागज़ी कार्रवाई), जिसे University of British Columbia में टिकाऊपन को केंद्र में रखकर विकसित किया गया है।</p>
        <h2>इसका उपयोग कैसे करें</h2>
        <p>एक मुफ़्त खाता बनाएँ, अपने खेत का नक्शा बनाएँ, और फ़सलों की योजना बनाना और कार्य दर्ज करना शुरू करें; रिकॉर्ड जमा होकर ऐसी रिपोर्टों में बदल जाते हैं जो आपकी अपनी हैं और जिन्हें आप एक्सपोर्ट कर सकते हैं। दो लिंक किए गए वीडियो इसे दोनों पक्षों से समझाते हैं: LiteFarm के पीछे के सिद्धांत, और इसे रोज़ाना इस्तेमाल करने वाले एक किसान संघ का व्यावहारिक प्रदर्शन।</p>
      id: |-
        <p>LiteFarm adalah perangkat lunak manajemen usaha tani yang gratis dan bersumber terbuka, dibangun bersama dan untuk petani (perencanaan tanaman, pengelolaan tugas, catatan panen, dan dokumen sertifikasi), dikembangkan di University of British Columbia dengan keberlanjutan sebagai intinya.</p>
        <h2>Cara menggunakannya</h2>
        <p>Buat akun gratis, petakan lahan Anda, lalu mulai merencanakan tanaman dan mencatat tugas; catatan-catatan itu terhimpun menjadi laporan yang Anda miliki dan dapat Anda ekspor. Dua video yang ditautkan membahasnya dari dua sisi: prinsip-prinsip di balik LiteFarm, dan panduan praktis dari sebuah asosiasi petani yang menggunakannya sehari-hari.</p>
      it: |-
        <p>LiteFarm è un software gratuito e open source per la gestione dell'azienda agricola, costruito con e per gli agricoltori (pianificazione delle colture, gestione delle attività, registri dei raccolti e documentazione per le certificazioni), sviluppato presso la University of British Columbia con la sostenibilità al centro.</p>
        <h2>Come usarlo</h2>
        <p>Crea un account gratuito, mappa la tua azienda agricola e inizia a pianificare le colture e a registrare le attività; i dati si accumulano in report che ti appartengono e che puoi esportare. Due video linkati lo presentano da entrambi i lati: i principi alla base di LiteFarm e una guida pratica di un'associazione di agricoltori che lo usa ogni giorno.</p>
      pt: |-
        <p>O LiteFarm é software gratuito e de código aberto para gestão agrícola, construído com e para agricultores (planeamento de culturas, gestão de tarefas, registos de colheita e documentação de certificação), desenvolvido na University of British Columbia com a sustentabilidade no centro.</p>
        <h2>Como usar</h2>
        <p>Crie uma conta gratuita, mapeie a sua exploração e comece a planear culturas e a registar tarefas; os registos acumulam-se em relatórios que são seus e que pode exportar. Dois vídeos ligados cobrem-no de ambos os lados: os princípios por trás do LiteFarm e um percurso prático de uma associação de agricultores que o usa no dia a dia.</p>
      ru: |-
        <p>LiteFarm — это бесплатное программное обеспечение с открытым исходным кодом для управления хозяйством, созданное вместе с фермерами и для фермеров (планирование посевов, управление задачами, учёт урожая и документы для сертификации), разработанное в Университете Британской Колумбии с устойчивостью в основе.</p>
        <h2>Как этим пользоваться</h2>
        <p>Создайте бесплатный аккаунт, нанесите своё хозяйство на карту и начните планировать посевы и записывать задачи; записи накапливаются в отчёты, которые принадлежат вам и которые можно экспортировать. Два видео по ссылкам раскрывают инструмент с обеих сторон: принципы, лежащие в основе LiteFarm, и практический разбор от фермерской ассоциации, которая пользуется им каждый день.</p>
      sw: |-
        <p>LiteFarm ni programu huria ya bure ya usimamizi wa shamba iliyoundwa pamoja na wakulima na kwa ajili yao (upangaji wa mazao, usimamizi wa kazi, kumbukumbu za mavuno na nyaraka za uthibitishaji), iliyotengenezwa katika Chuo Kikuu cha British Columbia ikiweka uendelevu kama msingi wake.</p>
        <h2>Jinsi ya kuitumia</h2>
        <p>Fungua akaunti ya bure, chora ramani ya shamba lako, kisha anza kupanga mazao na kuandika kumbukumbu za kazi; kumbukumbu hizo hujengeka kuwa ripoti unazozimiliki na kuweza kuzihamisha. Video mbili zilizounganishwa hapa zinaielezea kwa pande zote mbili: misingi ya LiteFarm, na maelekezo ya vitendo kutoka kwa chama cha wakulima kinachoitumia kila siku.</p>
      zh_CN: |-
        <p>LiteFarm 是一款免费的开源农场管理软件，与农民共同打造、为农民服务（作物规划、任务管理、收获记录和认证文书），由 University of British Columbia 开发，以可持续性为核心。</p>
        <h2>如何使用</h2>
        <p>注册一个免费账户，绘制您的农场地图，然后开始规划作物并记录任务；这些记录会逐步积累成归您所有、可随时导出的报告。链接的两个视频从两个方面进行了介绍：LiteFarm 背后的理念，以及一家日常使用它的农民协会所做的实操演示。</p>
