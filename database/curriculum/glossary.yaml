      hi: 'कृषि और खाद्य प्रणालियों में डिजिटल तकनीकों और डेटाफ़िकेशन का अनुप्रयोग, जो पारंपरिक खाद्य उत्पादन, वितरण और उपभोग की प्रक्रियाओं को डेटा-संचालित प्रक्रियाओं में बदल देता है।'
      id: 'Penerapan teknologi digital dan datafikasi dalam sistem pertanian dan pangan, yang mengubah proses produksi, distribusi, dan konsumsi pangan tradisional menjadi proses yang digerakkan oleh data.'
      it: "L'applicazione delle tecnologie digitali e della datificazione nei sistemi agricoli e alimentari, che trasforma i processi tradizionali di produzione, distribuzione e consumo del cibo in processi basati sui dati."
      pt: 'A aplicação de tecnologias digitais e da dataficação nos sistemas agrícolas e alimentares, transformando os processos tradicionais de produção, distribuição e consumo de alimentos em processos orientados por dados.'
      ru: 'Применение цифровых технологий и датафикации в сельскохозяйственных и продовольственных системах, превращающее традиционные процессы производства, распределения и потребления продовольствия в процессы, управляемые данными.'
      sw: 'Matumizi ya teknolojia za kidijitali na udatishaji katika mifumo ya kilimo na chakula, yakibadilisha michakato ya kawaida ya uzalishaji, usambazaji na ulaji wa chakula kuwa michakato inayoendeshwa na data.'
      zh_CN: 数字技术和数据化在农业和食物系统中的应用，将传统的食物生产、分配和消费过程转变为数据驱动的过程。
