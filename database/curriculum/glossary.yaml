      fil: 'Ang paggamit ng mga digital na teknolohiya at datafication sa mga sistema ng agrikultura at pagkain, na nagbabago sa mga tradisyonal na proseso ng produksyon, pamamahagi, at pagkonsumo ng pagkain tungo sa mga prosesong nakabatay sa data.'
