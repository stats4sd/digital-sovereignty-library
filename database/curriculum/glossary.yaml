      zh_CN: 食物系统的数字化涉及数字技术和数据化在农业领域的应用，将传统的食物生产、分配和消费过程转变为数据驱动的过程。
  -
    term:
      en: 'FAIR and CARE principles'
      ar: 'مبادئ FAIR و CARE'
      es: 'Principios FAIR y CARE'
      fil: 'Mga prinsipyong FAIR at CARE'
      fr: 'Principes FAIR et CARE'
      hi: 'FAIR और CARE सिद्धांत'
      id: 'Prinsip FAIR dan CARE'
      it: 'Principi FAIR e CARE'
      pt: 'Princípios FAIR e CARE'
      ru: 'Принципы FAIR и CARE'
      sw: 'Kanuni za FAIR na CARE'
      zh_CN: 'FAIR 与 CARE 原则'
    definition:
      en: 'The FAIR and CARE principles are guidelines for data management and stewardship, with FAIR standing for Findable, Accessible, Interoperable, and Reusable, while CARE stands for Collective benefit, Authority to control, Responsibility, and Ethics.'
      ar: 'مبادئ FAIR و CARE هي إرشادات لإدارة البيانات والإشراف عليها؛ إذ يرمز FAIR إلى: قابلة للعثور عليها (Findable)، وقابلة للوصول (Accessible)، وقابلة للتشغيل المتبادل (Interoperable)، وقابلة لإعادة الاستخدام (Reusable)، بينما يرمز CARE إلى: المنفعة الجماعية (Collective benefit)، وسلطة التحكم (Authority to control)، والمسؤولية (Responsibility)، والأخلاقيات (Ethics).'
      es: 'Los principios FAIR y CARE son directrices para la gestión y la custodia de los datos. FAIR significa, por sus siglas en inglés, localizables (Findable), accesibles (Accessible), interoperables (Interoperable) y reutilizables (Reusable), mientras que CARE significa beneficio colectivo (Collective benefit), autoridad para controlar (Authority to control), responsabilidad (Responsibility) y ética (Ethics).'
      fil: 'Ang mga prinsipyong FAIR at CARE ay mga gabay para sa pamamahala at pangangalaga ng data, kung saan ang FAIR ay nangangahulugang Findable (Mahahanap), Accessible (Maa-access), Interoperable (Magkakatugma), at Reusable (Magagamit muli), habang ang CARE ay nangangahulugang Collective benefit (Kolektibong benepisyo), Authority to control (Awtoridad na kontrolin), Responsibility (Pananagutan), at Ethics (Etika).'
      fr: "Les principes FAIR et CARE sont des lignes directrices pour la gestion et l'intendance des données. FAIR signifie Findable, Accessible, Interoperable, Reusable (trouvables, accessibles, interopérables et réutilisables), tandis que CARE signifie Collective benefit, Authority to control, Responsibility, Ethics (bénéfice collectif, autorité de contrôle, responsabilité et éthique)."
      hi: 'FAIR और CARE सिद्धांत डेटा प्रबंधन और संरक्षण के लिए दिशानिर्देश हैं, जिनमें FAIR का अर्थ है Findable (खोजने योग्य), Accessible (सुलभ), Interoperable (अंतर-संचालनीय) और Reusable (पुनः उपयोग योग्य), जबकि CARE का अर्थ है Collective benefit (सामूहिक लाभ), Authority to control (नियंत्रण का अधिकार), Responsibility (ज़िम्मेदारी) और Ethics (नैतिकता)।'
      id: 'Prinsip FAIR dan CARE adalah pedoman untuk pengelolaan dan penatagunaan data; FAIR merupakan singkatan dari Findable (dapat ditemukan), Accessible (dapat diakses), Interoperable (dapat saling beroperasi), dan Reusable (dapat digunakan kembali), sedangkan CARE merupakan singkatan dari Collective benefit (manfaat kolektif), Authority to control (kewenangan untuk mengendalikan), Responsibility (tanggung jawab), dan Ethics (etika).'
      it: 'I principi FAIR e CARE sono linee guida per la gestione e la custodia responsabile dei dati: FAIR sta per Findable, Accessible, Interoperable e Reusable (reperibili, accessibili, interoperabili e riutilizzabili), mentre CARE sta per Collective benefit, Authority to control, Responsibility ed Ethics (beneficio collettivo, autorità di controllo, responsabilità ed etica).'
      pt: 'Os princípios FAIR e CARE são orientações para a gestão e a custódia de dados: FAIR significa Findable, Accessible, Interoperable e Reusable (localizáveis, acessíveis, interoperáveis e reutilizáveis), enquanto CARE significa Collective benefit, Authority to control, Responsibility e Ethics (benefício coletivo, autoridade para controlar, responsabilidade e ética).'
      ru: 'Принципы FAIR и CARE — это руководящие принципы управления данными и ответственного обращения с ними. FAIR расшифровывается как Findable, Accessible, Interoperable, Reusable (находимые, доступные, интероперабельные и пригодные для повторного использования), а CARE — как Collective benefit, Authority to control, Responsibility, Ethics (коллективная выгода, полномочия контролировать, ответственность и этика).'
      sw: 'Kanuni za FAIR na CARE ni miongozo ya usimamizi na uangalizi wa data, ambapo FAIR inasimamia Findable, Accessible, Interoperable na Reusable (Zinazopatikana, Zinazofikika, Zinazoingiliana na Zinazoweza kutumika tena), na CARE inasimamia Collective benefit, Authority to control, Responsibility na Ethics (Manufaa ya pamoja, Mamlaka ya kudhibiti, Uwajibikaji na Maadili).'
      zh_CN: 'FAIR 与 CARE 原则是数据管理和数据监管的指导方针。FAIR 代表可发现（Findable）、可访问（Accessible）、可互操作（Interoperable）和可重用（Reusable）；CARE 则代表集体利益（Collective benefit）、控制权（Authority to control）、责任（Responsibility）和伦理（Ethics）。'
  -
    term:
      en: 'False climate solutions'
      ar: 'الحلول المناخية الزائفة'
      es: 'Falsas soluciones climáticas'
      fil: 'Mga huwad na solusyon sa klima'
      fr: 'Fausses solutions climatiques'
      hi: 'झूठे जलवायु समाधान'
