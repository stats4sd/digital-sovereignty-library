    definition:
      en: 'The digitalization of food systems involves the application of digital technologies and datafication in the agricultural sector, transforming traditional food production, distribution, and consumption processes into data-driven ones.'
      ar: 'تتضمن رقمنة النظم الغذائية تطبيق التقنيات الرقمية والتحويل إلى بيانات في القطاع الزراعي، بما يحوّل العمليات التقليدية لإنتاج الغذاء وتوزيعه واستهلاكه إلى عمليات قائمة على البيانات.'
      es: 'La digitalización de los sistemas alimentarios implica la aplicación de tecnologías digitales y de la datificación en el sector agrícola, transformando los procesos tradicionales de producción, distribución y consumo de alimentos en procesos basados en datos.'
      fil: 'Ang digitalisasyon ng mga sistema ng pagkain ay sumasaklaw sa paggamit ng mga digital na teknolohiya at datafication sa sektor ng agrikultura, na nagbabago sa mga tradisyonal na proseso ng produksyon, pamamahagi, at pagkonsumo ng pagkain tungo sa mga prosesong nakabatay sa data.'
      fr: 'La numérisation des systèmes alimentaires consiste à appliquer les technologies numériques et la datafication au secteur agricole, transformant les processus traditionnels de production, de distribution et de consommation alimentaires en processus fondés sur les données.'
      hi: 'खाद्य प्रणालियों के डिजिटलीकरण में कृषि क्षेत्र में डिजिटल तकनीकों और डेटाफ़िकेशन का अनुप्रयोग शामिल है, जो पारंपरिक खाद्य उत्पादन, वितरण और उपभोग की प्रक्रियाओं को डेटा-संचालित प्रक्रियाओं में बदल देता है।'
      id: 'Digitalisasi sistem pangan mencakup penerapan teknologi digital dan datafikasi di sektor pertanian, yang mengubah proses produksi, distribusi, dan konsumsi pangan tradisional menjadi proses yang digerakkan oleh data.'
      it: "La digitalizzazione dei sistemi alimentari consiste nell'applicazione delle tecnologie digitali e della datificazione nel settore agricolo, trasformando i processi tradizionali di produzione, distribuzione e consumo del cibo in processi basati sui dati."
      pt: 'A digitalização dos sistemas alimentares envolve a aplicação de tecnologias digitais e da dataficação no setor agrícola, transformando os processos tradicionais de produção, distribuição e consumo de alimentos em processos orientados por dados.'
