      zh_CN: 虚假气候解决方案
    definition:
      en: 'Measures or technologies that claim to address climate change but do not reduce greenhouse gas emissions at the source or create other social and environmental harms.'
      ar: 'تدابير أو تقنيات تزعم أنها تعالج تغيّر المناخ لكنها لا تقلّل انبعاثات غازات الدفيئة من مصدرها، أو تُسبّب أضرارًا اجتماعية وبيئية أخرى.'
      es: 'Medidas o tecnologías que afirman hacer frente al cambio climático pero que no reducen las emisiones de gases de efecto invernadero en su origen o que generan otros daños sociales y ambientales.'
      fil: 'Mga hakbang o teknolohiya na nagsasabing tumutugon sa pagbabago ng klima ngunit hindi nagpapababa ng mga emisyon ng greenhouse gas sa pinagmulan o lumilikha ng iba pang panlipunan at pangkapaligirang pinsala.'
      fr: "Mesures ou technologies qui prétendent lutter contre le changement climatique mais qui ne réduisent pas les émissions de gaz à effet de serre à la source, ou qui engendrent d'autres préjudices sociaux et environnementaux."
      hi: 'ऐसे उपाय या तकनीकें जो जलवायु परिवर्तन से निपटने का दावा करती हैं लेकिन स्रोत पर ग्रीनहाउस गैस उत्सर्जन कम नहीं करतीं या अन्य सामाजिक और पर्यावरणीय हानियाँ पैदा करती हैं।'
      id: 'Tindakan atau teknologi yang mengklaim mengatasi perubahan iklim tetapi tidak mengurangi emisi gas rumah kaca dari sumbernya, atau justru menimbulkan kerugian sosial dan lingkungan lainnya.'
      it: 'Misure o tecnologie che affermano di contrastare il cambiamento climatico ma che non riducono le emissioni di gas serra alla fonte o che creano altri danni sociali e ambientali.'
      pt: 'Medidas ou tecnologias que afirmam combater as mudanças climáticas, mas que não reduzem as emissões de gases com efeito de estufa na fonte ou que criam outros danos sociais e ambientais.'
      ru: 'Меры или технологии, которые заявляют о решении проблемы изменения климата, но не сокращают выбросы парниковых газов у источника или наносят иной социальный и экологический вред.'
      sw: 'Hatua au teknolojia zinazodai kukabiliana na mabadiliko ya tabianchi lakini hazipunguzi utoaji wa gesi joto kwenye chanzo, au zinasababisha madhara mengine ya kijamii na kimazingira.'
      zh_CN: 声称应对气候变化，但并未从源头减少温室气体排放，或者造成其他社会和环境危害的措施或技术。
  -
    term:
      en: 'Free, Prior, Informed Consent (FPIC)'
      ar: 'الموافقة الحرة والمسبقة والمستنيرة (FPIC)'
      es: 'Consentimiento libre, previo e informado (FPIC)'
      fil: 'Malaya, Nauuna at May-Kaalamang Pagsang-ayon (FPIC)'
      fr: 'Consentement libre, préalable et éclairé (FPIC / CLIP)'
      hi: 'स्वतंत्र, पूर्व और सूचित सहमति (FPIC)'
      id: 'Persetujuan Atas Dasar Informasi Awal Tanpa Paksaan (FPIC)'
      it: 'Consenso libero, previo e informato (FPIC)'
      pt: 'Consentimento Livre, Prévio e Informado (CLPI/FPIC)'
      ru: 'Свободное, предварительное и осознанное согласие (FPIC)'
      sw: 'Ridhaa Huru, ya Awali na yenye Taarifa (FPIC)'
      zh_CN: 自由、事先和知情同意（FPIC）
    definition:
      en: 'Free, Prior, Informed Consent (FPIC) is a principle that seeks to protect the rights of Indigenous Peoples and local communities in decision-making processes, particularly in relation to their lands, territories, and resources.'
      ar: 'الموافقة الحرة والمسبقة والمستنيرة (FPIC) مبدأ يسعى إلى حماية حقوق الشعوب الأصلية والمجتمعات المحلية في عمليات اتخاذ القرار، لا سيما فيما يتعلق بأراضيها وأقاليمها ومواردها.'
      es: 'El consentimiento libre, previo e informado (FPIC, por sus siglas en inglés) es un principio que busca proteger los derechos de los Pueblos Indígenas y las comunidades locales en los procesos de toma de decisiones, en particular en relación con sus tierras, territorios y recursos.'
      fil: 'Ang Malaya, Nauuna at May-Kaalamang Pagsang-ayon (Free, Prior, Informed Consent, FPIC) ay isang prinsipyong naglalayong protektahan ang mga karapatan ng mga Katutubong Mamamayan at mga lokal na komunidad sa mga proseso ng pagpapasya, lalo na kaugnay ng kanilang mga lupain, teritoryo, at yaman.'
      fr: 'Le consentement libre, préalable et éclairé (FPIC, ou CLIP en français) est un principe qui vise à protéger les droits des peuples autochtones et des communautés locales dans les processus décisionnels, en particulier en ce qui concerne leurs terres, leurs territoires et leurs ressources.'
      hi: 'स्वतंत्र, पूर्व और सूचित सहमति (FPIC) एक ऐसा सिद्धांत है जो निर्णय-प्रक्रियाओं में, विशेष रूप से उनकी भूमि, क्षेत्रों और संसाधनों के संबंध में, मूलनिवासी लोगों और स्थानीय समुदायों के अधिकारों की रक्षा करना चाहता है।'
      id: 'Persetujuan Atas Dasar Informasi Awal Tanpa Paksaan (FPIC) adalah prinsip yang bertujuan melindungi hak Masyarakat Adat dan komunitas lokal dalam proses pengambilan keputusan, khususnya yang berkaitan dengan tanah, wilayah, dan sumber daya mereka.'
      it: 'Il consenso libero, previo e informato (FPIC) è un principio che mira a tutelare i diritti dei Popoli Indigeni e delle comunità locali nei processi decisionali, in particolare in relazione alle loro terre, ai loro territori e alle loro risorse.'
      pt: 'O Consentimento Livre, Prévio e Informado (CLPI/FPIC) é um princípio que procura proteger os direitos dos Povos Indígenas e das comunidades locais nos processos de tomada de decisão, em particular em relação às suas terras, territórios e recursos.'
      ru: 'Свободное, предварительное и осознанное согласие (FPIC) — это принцип, направленный на защиту прав коренных народов и местных сообществ в процессах принятия решений, особенно в отношении их земель, территорий и ресурсов.'
      sw: 'Ridhaa Huru, ya Awali na yenye Taarifa (FPIC) ni kanuni inayolenga kulinda haki za Watu wa Asili na jamii za wenyeji katika michakato ya kufanya maamuzi, hasa kuhusiana na ardhi, maeneo na rasilimali zao.'
      zh_CN: 自由、事先和知情同意（FPIC）是一项旨在保护原住民和当地社区在决策过程中的权利的原则，特别是涉及其土地、领地和资源的决策。
  -
    term:
      en: Hyper-nudging
      ar: 'التوجيه المفرط (Hyper-nudging)'
      es: Hiper-nudging
      fil: Hyper-nudging
      fr: Hyper-nudging
      hi: हाइपर-नजिंग
      id: Hyper-nudging
      it: Hyper-nudging
      pt: Hyper-nudging
      ru: Гипер-наджинг
      sw: 'Usukumaji wa kupindukia (hyper-nudging)'
      zh_CN: 超级助推
    definition:
      en: 'Hyper-nudging is a concept that involves the use of big data and machine learning to provide highly personalized nudges, influencing individual behavior in real-time.'
      ar: 'التوجيه المفرط مفهوم يقوم على استخدام البيانات الضخمة والتعلّم الآلي لتقديم دفعات توجيهية شديدة التخصيص تؤثر في سلوك الأفراد في الوقت الفعلي.'
      es: 'El hiper-nudging es un concepto que implica el uso de big data y aprendizaje automático para ofrecer "empujones" (nudges) altamente personalizados que influyen en el comportamiento individual en tiempo real.'
      fil: 'Ang hyper-nudging ay isang konsepto na sumasaklaw sa paggamit ng big data at machine learning upang magbigay ng lubos na personalisadong mga "nudge" o pagtulak, na nakakaimpluwensya sa indibidwal na pag-uugali sa real-time.'
      fr: "L'hyper-nudging est un concept qui repose sur l'utilisation des mégadonnées et de l'apprentissage automatique pour proposer des incitations (nudges) hautement personnalisées, influençant le comportement individuel en temps réel."
      hi: 'हाइपर-नजिंग एक ऐसी अवधारणा है जिसमें बिग डेटा और मशीन लर्निंग का उपयोग करके अत्यधिक व्यक्तिगत रूप से अनुकूलित संकेत (नज) दिए जाते हैं, जो वास्तविक समय में व्यक्ति के व्यवहार को प्रभावित करते हैं।'
      id: 'Hyper-nudging adalah konsep yang melibatkan penggunaan big data dan pembelajaran mesin untuk memberikan dorongan (nudge) yang sangat dipersonalisasi, sehingga memengaruhi perilaku individu secara waktu nyata.'
      it: "L'hyper-nudging è un concetto che prevede l'uso di big data e apprendimento automatico per fornire spinte gentili (nudge) altamente personalizzate, influenzando il comportamento individuale in tempo reale."
      pt: 'Hyper-nudging é um conceito que envolve o uso de big data e de aprendizagem automática (machine learning) para fornecer estímulos (nudges) altamente personalizados, influenciando o comportamento individual em tempo real.'
      ru: 'Гипер-наджинг — это концепция, предполагающая использование больших данных и машинного обучения для высоко персонализированного «подталкивания», влияющего на поведение человека в режиме реального времени.'
      sw: 'Usukumaji wa kupindukia ni dhana inayohusisha matumizi ya data kubwa na ujifunzaji wa mashine kutoa misukumo iliyobinafsishwa kwa kiwango cha juu, ikiathiri tabia ya mtu binafsi kwa wakati halisi.'
      zh_CN: 超级助推是一个概念，指利用大数据和机器学习提供高度个性化的助推，从而实时影响个人行为。
  -
    term:
      en: 'Internet of Things'
      ar: 'إنترنت الأشياء'
      es: 'Internet de las cosas'
      fil: 'Internet of Things'
      fr: 'Internet des objets'
      hi: 'इंटरनेट ऑफ़ थिंग्स'
      id: 'Internet of Things'
      it: 'Internet delle cose'
      pt: 'Internet das Coisas'
      ru: 'Интернет вещей'
      sw: 'Intaneti ya Vitu'
      zh_CN: 物联网
    definition:
      en: 'The network of physical objects—"things"—that are embedded with sensors, software, and other technologies for the purpose of connecting and exchanging data with other devices and systems over the internet.'
      ar: 'شبكة الأشياء المادية — «الأشياء» — المزوّدة بأجهزة استشعار وبرمجيات وتقنيات أخرى بغرض الاتصال بأجهزة ونظم أخرى وتبادل البيانات معها عبر الإنترنت.'
      es: 'La red de objetos físicos —"cosas"— que incorporan sensores, software y otras tecnologías con el fin de conectarse e intercambiar datos con otros dispositivos y sistemas a través de internet.'
      fil: 'Ang network ng mga pisikal na bagay—mga "things" o "bagay"—na may nakakabit na mga sensor, software, at iba pang teknolohiya para sa layuning kumonekta at magpalitan ng data sa ibang mga device at sistema sa pamamagitan ng internet.'
      fr: "Le réseau d'objets physiques — les « objets » — équipés de capteurs, de logiciels et d'autres technologies dans le but de se connecter et d'échanger des données avec d'autres appareils et systèmes via internet."
      hi: 'भौतिक वस्तुओं—"चीज़ों"—का वह नेटवर्क जिनमें इंटरनेट के माध्यम से अन्य उपकरणों और प्रणालियों के साथ जुड़ने और डेटा का आदान-प्रदान करने के उद्देश्य से सेंसर, सॉफ़्टवेयर और अन्य तकनीकें अंतर्निहित होती हैं।'
      id: 'Jaringan objek fisik—"benda-benda"—yang dilengkapi dengan sensor, perangkat lunak, dan teknologi lain dengan tujuan menghubungkan dan bertukar data dengan perangkat dan sistem lain melalui internet.'
      it: 'La rete di oggetti fisici—le "cose"—dotati di sensori, software e altre tecnologie allo scopo di connettersi e scambiare dati con altri dispositivi e sistemi attraverso internet.'
      pt: 'A rede de objetos físicos — as "coisas" — equipados com sensores, software e outras tecnologias com o objetivo de se conectarem e trocarem dados com outros dispositivos e sistemas através da internet.'
      ru: 'Сеть физических объектов — «вещей», — оснащённых датчиками, программным обеспечением и другими технологиями для подключения к другим устройствам и системам через интернет и обмена данными с ними.'
      sw: 'Mtandao wa vitu halisi—"vitu"—vilivyowekwa vitambuzi, programu na teknolojia nyingine kwa lengo la kuunganishwa na kubadilishana data na vifaa na mifumo mingine kupitia intaneti.'
      zh_CN: 由实体物品——即“物”——组成的网络，这些物品内嵌传感器、软件和其他技术，目的是通过互联网与其他设备和系统连接并交换数据。
